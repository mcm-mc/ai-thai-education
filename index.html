    <!-- Script ควบคุมระบบทั้งหมด (รองรับ Safari / iOS สมบูรณ์แบบ) -->
    <script>
        // ข้อมูลดีเทลของแต่ละเสาหลัก
        const modalData = {
            mentor: {
                title: "01. AI Personal Mentor",
                subtitle: "ผู้ช่วยสอนส่วนตัว 24 ชั่วโมง",
                desc: "ระบบปัญญาประดิษฐ์ที่ออกแบบมาเพื่อทำหน้าที่เสมือนครูส่วนตัวของนักเรียนแต่ละคน คอยวิเคราะห์จุดแข็ง จุดอ่อน และความถนัดเฉพาะบุคคลแบบเรียลไทม์ พร้อมปรับเนื้อหาบทเรียนให้เข้ากับจังหวะการเรียนรู้ของเด็กแต่ละคนโดยไม่มีความกดดัน",
                features: ["วิเคราะห์ Learning Path รายบุคคล", "ให้คำปรึกษาและอธิบายโจทย์ยากๆ ได้ตลอด 24 ชม.", "รองรับการเรียนรู้แบบ Gamification สนุกและเข้าใจง่าย"]
            },
            copilot: {
                title: "02. Teacher Co-Pilot",
                subtitle: "ผู้ช่วยอัจฉริยะสำหรับคุณครู",
                desc: "เครื่องมือทรงพลังที่จะช่วยแบ่งเบาภาระงานหนักของครูไทย ลดเวลาการทำเอกสารธุรการและรายงานประจำเดือนลงถึง 70% ช่วยให้คุณครูมีเวลาทุ่มเทกับการดูแลเอาใจใส่นักเรียนได้อย่างเต็มที่",
                features: ["ร่างแผนการสอนและสื่อการสอนอัตโนมัติใน 1 นาที", "ระบบช่วยตรวจข้อสอบอัตนัยและให้ฟีดแบ็กแม่นยำ", "ลดเอกสารซ้ำซ้อน คืนเวลาชีวิตให้ห้องเรียน"]
            },
            edge: {
                title: "03. Equal Access Edge",
                subtitle: "ระบบ Offline Edge Box สำหรับพื้นที่ห่างไกล",
                desc: "นวัตกรรมฮาร์ดแวร์กล่องอัจฉริยะที่บรรจุ Small Language Models (SLM) ไว้ภายใน ทำงานได้ 100% แม้ไม่มีอินเทอร์เน็ต รองรับพลังงานโซลาร์เซลล์ ส่งตรงการศึกษาคุณภาพสูงสู่เด็กบนดอยและพื้นที่ห่างไกล",
                features: ["ทำงานแบบ Offline 100% ไม่พึ่งพาสัญญาณเน็ต", "รองรับพลังงานโซลาร์เซลล์ ติดตั้งง่ายทุกพื้นที่", "ซิงก์ข้อมูลอัปเดตอัตโนมัติเมื่อเชื่อมต่อเน็ตชั่วคราว"]
            },
            analytics: {
                title: "04. Policy Analytics",
                subtitle: "แดชบอร์ดวิเคราะห์ข้อมูลเชิงนโยบายระดับประเทศ",
                desc: "ระบบฐานข้อมูลและแดชบอร์ดอัจฉริยะสำหรับกระทรวงศึกษาธิการ ช่วยติดตามผลสัมฤทธิ์ทางการเรียน วิเคราะห์ความเสี่ยงที่เด็กอาจหลุดออกจากระบบการศึกษา และช่วยจัดสรรงบประมาณได้อย่างแม่นยำ",
                features: ["Real-time National Learning Analytics", "ระบบแจ้งเตือนความเสี่ยงเด็กนักเรียนหลุดระบบการศึกษา", "ช่วยให้ผู้บริหารการศึกษาตัดสินใจใช้งบประมาณตรงจุด"]
            }
        };

        function openModal(key) {
            const data = modalData[key];
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <div class="inline-block mb-2 px-3 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold">รายละเอียดเชิงลึก</div>
                <h3 class="text-xl sm:text-2xl font-bold text-white mb-1">${data.title}</h3>
                <div class="text-cyan-300 text-sm font-medium mb-4">${data.subtitle}</div>
                <p class="text-slate-300 text-sm leading-relaxed mb-4">${data.desc}</p>
                <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/50">
                    <div class="text-xs font-bold text-slate-200 mb-2 uppercase tracking-wider">✨ ฟีเจอร์หลักเด่น:</div>
                    <ul class="space-y-2 text-xs text-slate-300">
                        ${data.features.map(f => `<li class="flex items-center"><i class="fa-solid fa-check text-cyan-400 mr-2"></i>${f}</li>`).join('')}
                    </ul>
                </div>
            `;

            const modal = document.getElementById('infoModal');
            const box = document.getElementById('modalContentBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('infoModal');
            const box = document.getElementById('modalContentBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // ระบบสแกนลายนิ้วมือ (ใช้ Pointer Events สำหรับ Safari / iOS / iPadOS)
        const scannerBtn = document.getElementById('scannerBtn');
        const progressRing = document.getElementById('progressRing');
        const scannerStatus = document.getElementById('scannerStatus');
        const fpIcon = document.getElementById('fpIcon');
        const laserBeam = document.getElementById('laserBeam');
        const scannerGlow = document.getElementById('scannerGlow');
        const scannerOverlay = document.getElementById('scannerOverlay');
        const mainContent = document.getElementById('mainContent');

        let isHolding = false;
        let progress = 0;
        let scanTimer = null;
        const circumference = 289;

        function startScanning(e) {
            if (isHolding) return;
            isHolding = true;
            
            laserBeam.style.opacity = '1';
            scannerGlow.classList.remove('bg-cyan-500/10');
            scannerGlow.classList.add('bg-cyan-500/40', 'scale-125');
            fpIcon.classList.remove('text-slate-400');
            fpIcon.classList.add('text-cyan-400', 'animate-pulse');
            scannerStatus.textContent = "[ กำลังสแกนลายนิ้วมือ กรุณาถือค้างไว้... ]";

            scanTimer = setInterval(() => {
                progress += 2;
                let offset = circumference - (progress / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;

                if (progress >= 100) {
                    clearInterval(scanTimer);
                    completeScan();
                }
            }, 25);
        }

        function stopScanning() {
            if (!isHolding || progress >= 100) return;
            resetScan();
        }

        function resetScan() {
            clearInterval(scanTimer);
            isHolding = false;
            progress = 0;
            progressRing.style.strokeDashoffset = circumference;
            laserBeam.style.opacity = '0';
            scannerGlow.classList.add('bg-cyan-500/10');
            scannerGlow.classList.remove('bg-cyan-500/40', 'scale-125');
            fpIcon.classList.add('text-slate-400');
            fpIcon.classList.remove('text-cyan-400', 'animate-pulse');
            scannerStatus.textContent = "[ แตะค้างไว้เพื่อสแกนลายนิ้วมือ ]";
        }

        function completeScan() {
            scannerStatus.textContent = "✔ ยืนยันตัวตนสำเร็จ กำลังเข้าสู่ระบบ...";
            scannerStatus.classList.remove('text-cyan-400');
            scannerStatus.classList.add('text-emerald-400');
            fpIcon.className = "fa-solid fa-check text-4xl text-emerald-400 scale-125 transition-transform duration-300";
            
            setTimeout(() => {
                scannerOverlay.style.opacity = '0';
                setTimeout(() => {
                    scannerOverlay.style.display = 'none';
                    mainContent.classList.remove('hidden');
                    mainContent.style.opacity = '1';
                    document.body.classList.remove('overflow-hidden');
                }, 700);
            }, 800);
        }

        // ผูก Event ด้วย pointerdown / pointerup รองรับ Safari บน iOS ได้อย่างไร้รอยต่อ
        scannerBtn.addEventListener('pointerdown', startScanning);
        window.addEventListener('pointerup', stopScanning);
        window.addEventListener('pointercancel', stopScanning);
    </script>
