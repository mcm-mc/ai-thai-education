    <!-- Script: Fingerprint Biometric Scanner & Pointer Support -->
    <script>
        const scannerBtn = document.getElementById('scannerBtn');
        const progressRing = document.getElementById('progressRing');
        const scannerStatus = document.getElementById('scannerStatus');
        const fpIcon = document.getElementById('fpIcon');
        const laserBeam = document.getElementById('laserBeam');
        const scannerGlow = document.getElementById('scannerGlow');
        const scannerOverlay = document.getElementById('scannerOverlay');
        const mainContent = document.getElementById('mainContent');

        // ป้องกัน Error บน Safari Private Mode
        let isVerified = false;
        try {
            if (sessionStorage.getItem('verified') === 'true') {
                isVerified = true;
            }
        } catch (e) {
            console.log('SessionStorage blocked');
        }

        if (isVerified) {
            scannerOverlay.style.display = 'none';
            mainContent.classList.remove('hidden');
            mainContent.style.opacity = '1';
            document.body.classList.remove('overflow-hidden');
        }

        let isHolding = false;
        let progress = 0;
        let scanTimer = null;
        const circumference = 289;

        function startScanning(e) {
            if (isHolding) return;
            isHolding = true;
            
            laserBeam.style.opacity = '1';
            scannerGlow.classList.remove('bg-cyan-500/10');
            scannerGlow.classList.add('bg-cyan-500/40', 'scale-125');
            fpIcon.classList.remove('text-slate-400');
            fpIcon.classList.add('text-cyan-400', 'animate-pulse');
            scannerStatus.textContent = "[ กำลังสแกนลายนิ้วมือ กรุณาถือค้างไว้... ]";

            scanTimer = setInterval(() => {
                progress += 2;
                let offset = circumference - (progress / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;

                if (progress >= 100) {
                    clearInterval(scanTimer);
                    completeScan();
                }
            }, 25);
        }

        function stopScanning() {
            if (!isHolding || progress >= 100) return;
            resetScan();
        }

        function resetScan() {
            clearInterval(scanTimer);
            isHolding = false;
            progress = 0;
            progressRing.style.strokeDashoffset = circumference;
            laserBeam.style.opacity = '0';
            scannerGlow.classList.add('bg-cyan-500/10');
            scannerGlow.classList.remove('bg-cyan-500/40', 'scale-125');
            fpIcon.classList.add('text-slate-400');
            fpIcon.classList.remove('text-cyan-400', 'animate-pulse');
            scannerStatus.textContent = "[ แตะค้างไว้เพื่อสแกนลายนิ้วมือ ]";
        }

        function completeScan() {
            scannerStatus.textContent = "✔ ยืนยันตัวตนสำเร็จ กำลังเข้าสู่ระบบ...";
            scannerStatus.classList.remove('text-cyan-400');
            scannerStatus.classList.add('text-emerald-400');
            fpIcon.className = "fa-solid fa-check text-4xl text-emerald-400 scale-125 transition-transform duration-300";
            
            try {
                sessionStorage.setItem('verified', 'true');
            } catch (e) {}

            setTimeout(() => {
                scannerOverlay.style.opacity = '0';
                setTimeout(() => {
                    scannerOverlay.style.display = 'none';
                    mainContent.classList.remove('hidden');
                    mainContent.style.opacity = '1';
                    document.body.classList.remove('overflow-hidden');
                }, 700);
            }, 800);
        }

        scannerBtn.addEventListener('pointerdown', startScanning);
        window.addEventListener('pointerup', stopScanning);
        window.addEventListener('pointercancel', stopScanning);
    </script>
